<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aja PMS — Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; font-family: Inter, system-ui, sans-serif; background: #f0eee9; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data/sample.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="components/MobileStaff.jsx"></script>
<script type="text/babel" src="components/MobileGuest.jsx"></script>

<script type="text/babel">
  const Phone = ({ children }) => (
    <IOSDevice width={390} height={844}>
      {children}
    </IOSDevice>
  );

  const App = () => (
    <DesignCanvas>
      <DCSection
        title="Staff app · para equipe de limpeza e manutenção"
        subtitle="iOS · nativo · PT-BR · executa no campo entre unidades"
      >
        <DCArtboard label="01 · Minhas tarefas · hoje">
          <Phone><StaffTodayScreen/><StaffTabBar/></Phone>
        </DCArtboard>
        <DCArtboard label="02 · Detalhe da tarefa">
          <Phone><StaffTaskDetailScreen/></Phone>
        </DCArtboard>
        <DCArtboard label="03 · Em andamento · com fotos">
          <Phone><StaffInProgressScreen/></Phone>
        </DCArtboard>
        <DCArtboard label="04 · Concluído">
          <Phone><StaffDoneScreen/></Phone>
        </DCArtboard>
      </DCSection>

      <DCSection
        title="Guest check-in · para hóspedes antes de chegar"
        subtitle="Web · link enviado por email/WhatsApp · sem app pra instalar"
      >
        <DCArtboard label="01 · Boas-vindas">
          <Phone><GuestWelcomeScreen/></Phone>
        </DCArtboard>
        <DCArtboard label="02 · Documento">
          <Phone><GuestIDScreen/></Phone>
        </DCArtboard>
        <DCArtboard label="03 · Contrato + assinatura">
          <Phone><GuestContractScreen/></Phone>
        </DCArtboard>
        <DCArtboard label="04 · Chaves + chegada">
          <Phone><GuestKeysScreen/></Phone>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
