<style>
/* Tweaks panel */
.tweaks-panel {
  position: fixed; right: 20px; bottom: 20px;
  width: 280px; padding: 14px;
  background: var(--bg-raised); border: 1px solid var(--line-strong);
  border-radius: 14px; box-shadow: var(--shadow-lg);
  z-index: 900;
  animation: slideIn 200ms cubic-bezier(.2,.7,.3,1);
}
.tw-section { margin-top: 12px; }
.tw-section .label { margin-bottom: 6px; }
.tw-role {
  padding: 8px 10px; background: var(--bg-card);
  border: 1px solid var(--line); border-radius: 8px;
  text-align: left; cursor: pointer; color: inherit; font: inherit;
  transition: all 120ms;
}
.tw-role:hover { border-color: var(--line-strong); }
.tw-role.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
</style>
</head>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
